image: node:24-alpine

stages:
  - deploy

deploy-pages:
  stage: deploy
  script:
    - export NEXT_PUBLIC_BASE_PATH="$(node -e 'const path = new URL(process.env.CI_PAGES_URL).pathname.replace(/\/+$/, ""); process.stdout.write(path === "/" ? "" : path)')"
    - npm ci --no-audit --no-fund
    - npm run build
    - cp -a out/. public/
    - cp out/index.html public/404.html
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
